
services:
  db:
    image: postgres:16
    container_name: digitalwitness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dw
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dw_local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: digitalwitness-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dwminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dw_minio_local_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
